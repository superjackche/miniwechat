name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Gradle cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
      
    - name: Run unit tests
      run: ./gradlew test

    - name: Run lint
      run: ./gradlew lint

    - name: Build debug validation APK
      run: ./gradlew assembleDebug

    - name: Build release APK
      run: ./gradlew assembleRelease

    - name: Sign release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
      run: |
        keytool -genkeypair -v \
          -keystore "$RUNNER_TEMP/release.keystore" \
          -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
          -alias release -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=NearbyChater CI,O=NearbyChater,C=US"
        mv app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-release-unsigned.apk"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
          --ks "$RUNNER_TEMP/release.keystore" \
          --ks-pass "pass:$KEYSTORE_PASSWORD" \
          --key-pass "pass:$KEYSTORE_PASSWORD" \
          --out app/build/outputs/apk/release/app-release.apk \
          "$RUNNER_TEMP/app-release-unsigned.apk"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-lint-reports
        path: |
          app/build/test-results/**
          app/build/reports/tests/**
          app/build/reports/lint-results*.html
          app/build/reports/lint-results*.xml
        if-no-files-found: warn
      
    - name: Upload debug validation APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-validation
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload signed release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app/build/outputs/apk/release/app-release.apk
